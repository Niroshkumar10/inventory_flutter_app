name: inventory_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.1.0+9

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # PDF generation
  pdf: ^3.10.8
  printing: ^5.13.1

  # CSV
  csv: ^5.0.3

  # Firebase — all v3 generation, must match
  firebase_core: ^3.6.0          # ← was ^2.32.0
  firebase_auth: ^5.3.1          # ← was ^4.20.0
  cloud_firestore: ^5.4.4        # ← was ^4.17.5
  firebase_storage: ^12.3.2      # ← was ^11.7.7
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.3

  # State management
  provider: ^6.1.2

  # Navigation
  go_router: ^14.6.3

  # Logging
  logger: ^2.4.0

  # Local storage
  shared_preferences: ^2.2.2

  # UI
  animated_splash_screen: ^1.3.0
  fl_chart: ^0.69.2

  # Utilities
  uuid: ^4.4.0
  intl: ^0.18.1
  http: ^1.1.0
  crypto: ^3.0.3

  # File handling
  path_provider: ^2.1.1
  open_file: ^3.2.1
  file_picker: ^8.0.0

  # Sharing
  share_plus: ^10.0.0

  # Maps & Location
  geolocator: ^10.1.0
  geocoding: ^2.1.1
  google_maps_flutter: ^2.5.0
  url_launcher: ^6.2.0

  # Permissions
  permission_handler: ^11.0.1

  # App info
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/Roboto-Regular.ttf
    - assets/fonts/Roboto-Bold.ttf
    - assets/logo/app_logo.png